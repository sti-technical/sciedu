services:
  - type: web
    name: sciedu
    runtime: docker
    plan: free
    region: singapore
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"   # TiDB Cloud ka port (XAMPP/MySQL par 3306 hota hai)
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASS
        sync: false
      - key: DB_SSL
        value: "1"
